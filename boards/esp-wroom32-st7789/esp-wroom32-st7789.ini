; PlatformIO Project Configuration File
; ESP32-D0WD-V3 (4MB Flash) — Headless (No Screen)

[env:esp-wroom32-st7789]
extends = env_light
board = esp32
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp-wroom32-st7789>
build_flags =
	${env.build_flags}
	${env_light.build_flags}
	-Iboards/esp-wroom32-st7789

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=0

	; ==================== Headless Display & Touch (-1 = disabled) ====================
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_CS=-1
	-DTFT_DC=-1
	-DTFT_RST=-1
	-DTFT_BL=-1
	-DTFT_MOSI=-1
	-DTFT_SCLK=-1
	-DTFT_MISO=-1
	-DTOUCH_CS=-1
	-DROTATION=1

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"ESP32-Headless"'
	-DBTN_ALIAS='"OK"'

	; Infrared Led
	-DIR_TX_PINS='{ {"G4", 4}, {"G2", 2}, {"G25", 25} }'
	-DIR_RX_PINS='{ {"G4", 4}, {"G2", 2}, {"G25", 25} }'

	; Radio Frequency (one pin modules) pin setting
	-DRF_TX_PINS='{ {"G4", 4}, {"G2", 2}, {"G25", 25} }'
	-DRF_RX_PINS='{ {"G4", 4}, {"G2", 2}, {"G25", 25} }'

lib_deps =
	${env_light.lib_deps}
